  <body>
    <h2>Picture interpretation</h2>
    <p>
        In picture illustrated tests oblique shading is used to mark elements visible only by one eye.
        Shading with angle 45&deg means element visible by first eye.
        Shading with angle 135&deg means element visible by second eye.
    </p>
