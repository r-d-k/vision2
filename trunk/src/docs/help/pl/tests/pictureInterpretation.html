    <h2>Interpretacja rysunków</h2>
    <p>
        W rysunkach obrazujących testy użyto ukośnego kreskowania na oznaczenie elementów widocznych jednoocznie. Kreskowanie pod kątem 45&deg; oznacza, że element jest widoczny jednym okiem. Elementy zakreskowane pod kątem 135&deg; są widoczne drugim okiem.
    </p>
